# The try of workline step 9 (ADR-0050): main after a merge, a gate over
# lint debt in src/auth/clean.go, the docs' budgets low so main has some.
routing:
  events: {merge-request: [committer, documentalist, "gate:lint"]}
gates:
  lint:
    checks:
      - id: golangci-lint
        run: golangci-lint run --max-issues-per-linter=0 --max-same-issues=0 --output.text.path=stdout --output.sarif.path={out}/lint.sarif ./...
        output: sarif
        max: {error: 0}
roles:
  documentalist:
    settings:
      budgets: {doc-lines: 5}
