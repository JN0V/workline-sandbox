# The try of workline#522: a fork's pull request, a gate over lint debt in
# src/auth/clean.go.
routing:
  events: {merge-request: [committer, documentalist, "gate:lint", inspector]}
gates:
  lint:
    checks:
      - id: golangci-lint
        run: golangci-lint run --max-issues-per-linter=0 --max-same-issues=0 --output.text.path=stdout --output.sarif.path={out}/lint.sarif ./...
        output: sarif
        max: {error: 0}
