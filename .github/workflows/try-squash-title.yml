# The try of workline's squash title (ADR-0051, step 12): the committer
# alone on the pull request, the engine built from workline's branch.
name: try-squash-title
on:
  pull_request: {types: [opened, synchronize, reopened, edited]}
permissions: {contents: read, pull-requests: read}
jobs:
  committer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: JN0V/workline, ref: feat/squash-title, path: .wl}
      - uses: actions/setup-go@v5
        with: {go-version-file: .wl/go.mod, cache: false}
      - run: cd .wl && go build -o "$RUNNER_TEMP/workline" ./cmd/workline && rm -rf "$GITHUB_WORKSPACE/.wl"
      - env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/workline" route merge-request --ai none --forge github --target "merge-request:$NUMBER" --input "range=$RANGE"
