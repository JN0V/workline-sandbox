# Try of workline#375: workline-apply.yml's apply, in the review's group
# workline.yml's judge shares, keyed by the pull request's number.
name: probe review lock apply
on:
  workflow_run: {workflows: [probe review lock], types: [completed]}
permissions: {}
jobs:
  apply:
    if: github.event.workflow_run.conclusion != 'cancelled'
    concurrency: {group: "probe-review-${{ github.event.workflow_run.pull_requests[0].number }}", cancel-in-progress: false}
    runs-on: ubuntu-latest
    steps:
      - run: echo "apply group=probe-review-${{ github.event.workflow_run.pull_requests[0].number }} head=${{ github.event.workflow_run.head_sha }} started=$(date -u +%FT%TZ)"; sleep 60; echo "ended=$(date -u +%FT%TZ)"
