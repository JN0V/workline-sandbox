# A try's helper (workline ADR-0058, step 2): a comment written with the
# job's own token, as the tester's record would be in this sandbox.
name: bounds try record
on:
  workflow_dispatch:
    inputs:
      pr: {required: true}
      body: {required: true}
permissions: {pull-requests: write}
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}", PR: "${{ inputs.pr }}", BODY: "${{ inputs.body }}"}
        run: gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$BODY"
