# Probe for workline #1029: the follow job's condition from
# ci/github/workline-merge.yml, on an issue closed. Removed after the try.
name: probe demotion close
on:
  issues: {types: [labeled, closed]}
permissions: {}
jobs:
  follow:
    if: >-
      github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'workline:candidate') &&
      (github.event.action == 'closed' || github.event.label.name == 'workline:accepted') ||
      github.event.action == 'closed' && startsWith(github.event.issue.title, 'workline: its ') &&
      contains(github.event.issue.title, 'merge requests wait for a person''s yes again')
    runs-on: ubuntu-latest
    steps:
      - run: echo "follow would run on #${{ github.event.issue.number }}"
