# The try of workline's squash title: judge, the committer alone, the
# engine built from workline's branch.
name: workline
on:
  pull_request: {types: [opened, synchronize, reopened, ready_for_review]}
permissions: {}
jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: JN0V/workline, ref: feat/squash-title, path: .wl, fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: .wl/go.mod, cache: false}
      - run: mkdir -p "$RUNNER_TEMP/bin" && (cd .wl && go build -o "$RUNNER_TEMP/bin/workline" ./cmd/workline) && rm -rf .wl
      - env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/bin/workline" route merge-request --ai none --forge github --target "merge-request:$NUMBER" --input "range=$RANGE"
