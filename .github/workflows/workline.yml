# A try of workline's release holds (ADR-0051, step 3c): the judge of
# ci/github/workline.yml, its permissions as there, the engine built from
# the branch feat/release-holds. Removed after the try.
name: workline
on:
  pull_request: {types: [opened, synchronize, reopened, ready_for_review]}
permissions: {}
jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write, pull-requests: read, issues: read, checks: read, statuses: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}"}
      - uses: actions/checkout@v4
        with: {repository: JN0V/workline, ref: feat/release-holds, path: .engine-src, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: .engine-src/go.mod, cache: false}
      - name: The engine, from the branch
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          (cd .engine-src && CGO_ENABLED=0 go build -o "$bin/workline" ./cmd/workline) && rm -rf .engine-src
          cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get https://github.com/gitleaks/gitleaks/releases/download/v8.30.1 gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt gitleaks
          echo "$bin" >> "$GITHUB_PATH"
      - name: The line for this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          status=0
          workline route merge-request --ai none --no-apply \
            --forge github --target merge-request:${{ github.event.pull_request.number }} --branch "$HEAD_REF" \
            --input range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            --summary workline-summary.md --json > line.json || status=$?
          jq -r '.status + " — " + .summary' line.json
          jq -r '.findings[]? | select(.rule | startswith("release")) | "- \(.rule) \(.where): \(.message)"' line.json
          cat workline-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
