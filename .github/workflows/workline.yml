# The try of workline's ADR-0051 step 4: the documentalist on a pull
# request, engine built from workline's branch, pushes nothing to it.
name: workline
on:
  pull_request:
permissions: {}
jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, issues: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}"}
      - uses: actions/checkout@v4
        with: {repository: JN0V/workline, ref: feat/no-stamps-on-prs, path: .wl, fetch-depth: 1}
      - uses: actions/setup-go@v5
        with: {go-version-file: .wl/go.mod, cache: false}
      - name: workline
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && (cd .wl && go build -o "$RUNNER_TEMP/bin/workline" ./cmd/workline) && rm -rf .wl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The documentalist on this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          before=$(git ls-remote origin "refs/heads/$GITHUB_HEAD_REF" | cut -f1)
          status=0
          workline run-role documentalist --event merge-request --ai "cmd:sh $GITHUB_WORKSPACE/ci/try-agent.sh" --forge github \
            --target "merge-request:$NUMBER" --branch "$GITHUB_HEAD_REF" --input "range=$RANGE" --json > out.json || status=$?
          jq -c '.status, [.findings[]? | {rule, where, level}]' out.json
          after=$(git ls-remote origin "refs/heads/$GITHUB_HEAD_REF" | cut -f1)
          echo "status=$status branch before=$before after=$after"
          [ "$before" = "$after" ] || { echo "::error::the branch moved: something was pushed"; exit 1; }
          exit "$status"
